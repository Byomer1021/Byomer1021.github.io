<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img">
<title>Ömer Can Atlı</title>
<!-- Redrawn as vector rather than downscaled from the PNG: at 16px a tab icon
     has about 16 device pixels to work with, and stroked geometry stays legible
     where a resampled bitmap turns to mush. Coordinates and the 0.066 stroke
     ratio are measured off the original artwork; colours are sampled from it
     (#00f2fe, #38ef7d) with the site's own ground behind them. -->
<rect x="0" y="0" width="64" height="64" rx="14" ry="14" fill="#0e0e12"/>
<g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="4.6">
  <path d="M22.4 21.9 L10.4 32 L22.4 43.1" stroke="#00f2fe"/>
  <path d="M41.6 21.9 L53.6 32 L41.6 43.1" stroke="#00f2fe"/>
  <path d="M35.0 17.3 L28.6 47.7" stroke="#38ef7d"/>
</g>
<circle cx="32" cy="32" r="3.4" fill="#00f2fe"/>
</svg>
